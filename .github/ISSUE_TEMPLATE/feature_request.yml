name: Feature request
description: Suggest an improvement or new capability for go-intl
title: "[Feature] "
labels:
  - enhancement
assignees: []

body:
  - type: markdown
    attributes:
      value: Describe the user problem first so the proposed solution can be evaluated in context.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation are you experiencing?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like and why it would help.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative designs you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, screenshots, or related links when useful.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues and discussions for similar requests.
          required: true
