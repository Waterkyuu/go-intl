name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Test the Codex commit hook
        run: go test -race .codex/hooks/*.go

      - name: Lint Go packages
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Check Go formatting
        run: |
          git ls-files -z -- '*.go' | xargs -0 golangci-lint fmt
          git diff --exit-code -- '*.go'

      - name: Verify, test, and build Go packages
        run: |
          go mod verify
          go test -race ./...
          go build ./...
