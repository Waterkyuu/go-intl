    <text x="22" y="387" font-size="16">8 distinct arguments</text>
    <text x="449" y="387" font-size="16" text-anchor="end">156.70  ·  40  ·  2</text>
    <text x="633" y="387" font-size="16" text-anchor="end">1,152.50  ·  528  ·  21</text>
    <rect x="654" y="377" width="64.68" height="6" rx="3" fill="#62b0ff"/>
    <text x="817" y="387" font-size="16" text-anchor="end" font-weight="650" fill="#a5d2ff">7.35×</text>
    <text x="22" y="424" font-size="16">16 distinct arguments</text>
    <text x="449" y="424" font-size="16" text-anchor="end">257.10  ·  136  ·  3</text>
    <text x="633" y="424" font-size="16" text-anchor="end">2,015.50  ·  816  ·  37</text>
    <rect x="654" y="414" width="68.99" height="6" rx="3" fill="#62b0ff"/>
    <text x="817" y="424" font-size="16" text-anchor="end" font-weight="650" fill="#a5d2ff">7.84×</text>
    <text x="22" y="461" font-size="16">32 distinct arguments</text>
    <text x="449" y="461" font-size="16" text-anchor="end">470.55  ·  264  ·  3</text>
    <text x="633" y="461" font-size="16" text-anchor="end">3,877.00  ·  1,520  ·  70</text>
    <rect x="654" y="451" width="72.51" height="6" rx="3" fill="#62b0ff"/>
    <text x="817" y="461" font-size="16" text-anchor="end" font-weight="650" fill="#a5d2ff">8.24×</text>
    <text x="22" y="498" font-size="16">One argument repeated 16 times</text>
    <text x="449" y="498" font-size="16" text-anchor="end">265.55  ·  136  ·  3</text>
    <text x="633" y="498" font-size="16" text-anchor="end">2,004.00  ·  816  ·  37</text>
    <rect x="654" y="488" width="66.44" height="6" rx="3" fill="#62b0ff"/>
    <text x="817" y="498" font-size="16" text-anchor="end" font-weight="650" fill="#a5d2ff">7.55×</text>
    <rect x="0" y="517" width="840" height="29" fill="#303944"/>
    <text x="22" y="537" font-size="15" font-weight="650" fill="#c9e4ff">Static lookup and plural  ·  median of 3 runs</text>
    <text x="22" y="572" font-size="16">Repeated static key</text>
    <text x="449" y="572" font-size="16" text-anchor="end">12.9  ·  0  ·  0</text>
    <text x="633" y="572" font-size="16" text-anchor="end">116.8  ·  0  ·  0</text>
    <rect x="654" y="562" width="79.64" height="6" rx="3" fill="#62b0ff"/>
    <text x="817" y="572" font-size="16" text-anchor="end" font-weight="650" fill="#a5d2ff">9.05×</text>
    <text x="22" y="609" font-size="16">Rotating static keys (1,024 keys)</text>
    <text x="449" y="609" font-size="16" text-anchor="end">15.8  ·  0  ·  0</text>
    <text x="633" y="609" font-size="16" text-anchor="end">125.8  ·  0  ·  0</text>
    <rect x="654" y="599" width="70.05" height="6" rx="3" fill="#62b0ff"/>
    <text x="817" y="609" font-size="16" text-anchor="end" font-weight="650" fill="#a5d2ff">7.96×</text>
    <text x="22" y="646" font-size="16">English plural (count 7)</text>
    <text x="449" y="646" font-size="16" text-anchor="end">81.2  ·  16  ·  2</text>
    <text x="633" y="646" font-size="16" text-anchor="end">336.5  ·  344  ·  8</text>
    <rect x="654" y="636" width="36.43" height="6" rx="3" fill="#62b0ff"/>
    <text x="817" y="646" font-size="16" text-anchor="end" font-weight="650" fill="#a5d2ff">4.14×</text>
  </g>
</svg>
