<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 680" width="840" height="680" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">Translation benchmarks</title>
  <desc id="desc">Ten interpolation cases from the v0.1.1 comparison and three cases from the original static and plural benchmarks. Each row shows time, allocated bytes, and allocation count per operation for both libraries, and the ratio of their times.</desc>
  <rect width="840" height="680" rx="12" fill="#202329"/>
  <g font-family="system-ui, sans-serif" fill="#f4f7fb" style="font-variant-numeric:tabular-nums">
    <text x="22" y="38" font-size="26" font-weight="650">Translation benchmarks</text>
    <text x="818" y="36" font-size="15" text-anchor="end" fill="#bbc5d1">Apple M3 Pro  ·  Go 1.27.1</text>
    <text x="22" y="84" font-size="16" font-weight="650">Case</text>
    <text x="449" y="73" font-size="17" text-anchor="end" font-weight="650">go-intl</text>
    <text x="449" y="96" font-size="13" text-anchor="end" fill="#bbc5d1">ns/op  ·  B/op  ·  allocs/op</text>
    <text x="633" y="73" font-size="17" text-anchor="end" font-weight="650">go-i18n</text>
    <text x="633" y="96" font-size="13" text-anchor="end" fill="#bbc5d1">ns/op  ·  B/op  ·  allocs/op</text>
    <text x="816" y="84" font-size="16" text-anchor="end" font-weight="650">go-intl speedup</text>
    <rect x="0" y="110" width="840" height="29" fill="#303944"/>
    <text x="22" y="130" font-size="15" font-weight="650" fill="#c9e4ff">Interpolation  ·  median of 6 runs</text>
    <text x="22" y="165" font-size="16">Bare argument  {first}</text>
    <text x="449" y="165" font-size="16" text-anchor="end">27.54  ·  8  ·  1</text>
    <text x="633" y="165" font-size="16" text-anchor="end">284.60  ·  275  ·  7</text>
    <rect x="654" y="155" width="90.90" height="6" rx="3" fill="#62b0ff"/>
    <text x="817" y="165" font-size="16" text-anchor="end" font-weight="650" fill="#a5d2ff">10.33×</text>
    <text x="22" y="202" font-size="16" font-family="ui-monospace, monospace">Hello, {first}!</text>
    <text x="449" y="202" font-size="16" text-anchor="end">52.34  ·  24  ·  2</text>
    <text x="633" y="202" font-size="16" text-anchor="end">300.70  ·  288  ·  7</text>
    <rect x="654" y="192" width="50.60" height="6" rx="3" fill="#62b0ff"/>
    <text x="817" y="202" font-size="16" text-anchor="end" font-weight="650" fill="#a5d2ff">5.75×</text>
    <text x="22" y="239" font-size="16" font-family="ui-monospace, monospace">Item {id}.   (42)</text>
    <text x="449" y="239" font-size="16" text-anchor="end">88.86  ·  24  ·  3</text>
    <text x="633" y="239" font-size="16" text-anchor="end">307.60  ·  280  ·  7</text>
    <rect x="654" y="229" width="30.45" height="6" rx="3" fill="#62b0ff"/>
    <text x="817" y="239" font-size="16" text-anchor="end" font-weight="650" fill="#a5d2ff">3.46×</text>
    <text x="22" y="276" font-size="16" font-family="ui-monospace, monospace">{first} {last}</text>
    <text x="449" y="276" font-size="16" text-anchor="end">70.28  ·  24  ·  2</text>
    <text x="633" y="276" font-size="16" text-anchor="end">420.15  ·  320  ·  9</text>
    <rect x="654" y="266" width="52.62" height="6" rx="3" fill="#62b0ff"/>
    <text x="817" y="276" font-size="16" text-anchor="end" font-weight="650" fill="#a5d2ff">5.98×</text>
    <text x="22" y="313" font-size="16" font-family="ui-monospace, monospace">{first}{last}</text>
    <text x="449" y="313" font-size="16" text-anchor="end">68.54  ·  24  ·  2</text>
    <text x="633" y="313" font-size="16" text-anchor="end">410.20  ·  320  ·  9</text>
    <rect x="654" y="303" width="52.62" height="6" rx="3" fill="#62b0ff"/>
    <text x="817" y="313" font-size="16" text-anchor="end" font-weight="650" fill="#a5d2ff">5.98×</text>
    <text x="22" y="350" font-size="16">4 distinct arguments</text>
    <text x="449" y="350" font-size="16" text-anchor="end">97.93  ·  24  ·  2</text>
    <text x="633" y="350" font-size="16" text-anchor="end">670.65  ·  384  ·  13</text>
    <rect x="654" y="340" width="60.28" height="6" rx="3" fill="#62b0ff"/>
