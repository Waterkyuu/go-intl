<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 408" width="640" height="408" role="img" aria-labelledby="title" lang="zh-CN">
  <title id="title">每次翻译耗时（ns/op），越短越快</title>
  <rect width="640" height="408" rx="12" fill="#f6f8fa"/>
  <g font-family="system-ui, sans-serif" font-size="15" fill="#1f2328">
    <text x="16" y="28" font-weight="650">每次翻译耗时（ns/op），越短越快</text>
    <text x="622" y="28" text-anchor="end">分配/次</text>
    <text x="16" y="60" font-weight="650">重复读取同一静态键</text>
    <text x="16" y="83">go-intl</text>
    <rect x="84" y="71" width="16.512" height="13" rx="2" fill="#0969da"/>
    <text x="108.512" y="83">12.9</text>
    <text x="622" y="83" text-anchor="end">0</text>
    <text x="16" y="106">go-i18n</text>
    <rect x="84" y="94" width="149.504" height="13" rx="2" fill="#68788a"/>
    <text x="241.504" y="106">116.8</text>
    <text x="622" y="106" text-anchor="end">0</text>
    <text x="16" y="150" font-weight="650">轮流读取静态键</text>
    <text x="16" y="173">go-intl</text>
    <rect x="84" y="161" width="20.224" height="13" rx="2" fill="#0969da"/>
    <text x="112.224" y="173">15.8</text>
    <text x="622" y="173" text-anchor="end">0</text>
    <text x="16" y="196">go-i18n</text>
    <rect x="84" y="184" width="161.024" height="13" rx="2" fill="#68788a"/>
    <text x="253.024" y="196">125.8</text>
    <text x="622" y="196" text-anchor="end">0</text>
    <text x="16" y="240" font-weight="650">问候语插入姓名</text>
    <text x="16" y="263">go-intl</text>
    <rect x="84" y="251" width="84.736" height="13" rx="2" fill="#0969da"/>
    <text x="176.736" y="263">66.2</text>
    <text x="622" y="263" text-anchor="end">3</text>
    <text x="16" y="286">go-i18n</text>
    <rect x="84" y="274" width="368.896" height="13" rx="2" fill="#68788a"/>
    <text x="460.896" y="286">288.2</text>
    <text x="622" y="286" text-anchor="end">7</text>
    <text x="16" y="330" font-weight="650">英文复数（数量为 7）</text>
    <text x="16" y="353">go-intl</text>
    <rect x="84" y="341" width="103.936" height="13" rx="2" fill="#0969da"/>
    <text x="195.936" y="353">81.2</text>
    <text x="622" y="353" text-anchor="end">2</text>
    <text x="16" y="376">go-i18n</text>
    <rect x="84" y="364" width="430.720" height="13" rx="2" fill="#68788a"/>
    <text x="522.720" y="376">336.5</text>
    <text x="622" y="376" text-anchor="end">8</text>
  </g>
</svg>
